<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>绝密行动</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/cards.css">
    <link rel="stylesheet" href="/static/css/table.css">
    <link rel="stylesheet" href="/static/css/stage.css">
    <link rel="stylesheet" href="/static/css/cockpit.css">
</head>
<body class="screen-lobby">

    <!-- Lobby Screen -->
    <div id="lobby-screen">
        <div class="lobby-container">
            <h1 class="lobby-title">绝密行动</h1>
            <p class="lobby-subtitle">Secret Mission</p>

            <div class="lobby-form">
                <input id="player-name" type="text" placeholder="你的代号..." maxlength="8" autocomplete="off">
                <div class="lobby-actions">
                    <button id="btn-create-room" class="btn btn-primary">创建房间</button>
                    <div class="lobby-join">
                        <input id="room-code-input" type="text" placeholder="房间号" maxlength="6" autocomplete="off">
                        <button id="btn-join-room" class="btn btn-secondary">加入</button>
                    </div>
                </div>
            </div>

            <div id="lobby-room" class="lobby-room hidden">
                <div class="room-header">
                    <span>房间: <strong id="room-id-label"></strong></span>
                    <span id="player-count-label"></span>
                </div>
                <div id="lobby-player-list" class="player-list"></div>
                <button id="btn-start-game" class="btn btn-accent hidden">开始游戏</button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen">
        <!-- Top Bar: Phase pipeline -->
        <div id="top-bar">
            <div id="phase-bar">
                <div class="phase-track">
                    <div class="phase-line"></div>
                    <span class="phase-node" data-phase="draw">摸牌</span>
                    <span class="phase-node" data-phase="action">出牌</span>
                    <span class="phase-node" data-phase="transmission">传递</span>
                    <span class="phase-node" data-phase="contention">争夺</span>
                    <span class="phase-node" data-phase="reception">接收</span>
                </div>
            </div>
        </div>

        <!-- Table: Other Players -->
        <div id="table-area"></div>

        <!-- Stage: Intel card only -->
        <div id="stage-area">
            <div id="intel-card-slot"></div>
        </div>

        <!-- Cockpit: My Hand -->
        <div id="cockpit-area">
            <div id="my-hand"></div>
        </div>

        <!-- Action Bar: prompt + action buttons between hand and status ribbon -->
        <div id="action-bar">
            <div id="contention-timer" class="contention-timer hidden">
                <div class="contention-timer-fill"></div>
                <span class="contention-timer-text"></span>
            </div>
            <div id="stage-prompt"></div>
            <div id="stage-buttons"></div>
        </div>

        <!-- Intel Animation Layer -->
        <div id="intel-anim-layer"></div>

        <!-- Bottom Ribbon: status info only -->
        <div id="bottom-ribbon">
            <div class="ribbon-faction-strip"></div>
            <div class="ribbon-row">
                <div id="my-intel-bar"></div>
                <div class="ribbon-divider"></div>
                <span id="room-label"></span>
                <span id="identity-label"></span>
            </div>
        </div>
    </div>

    <!-- Card Modal (tap to inspect) -->
    <div id="card-modal" class="hidden">
        <div id="card-modal-backdrop"></div>
        <div id="card-modal-content"></div>
    </div>

    <!-- Game Over Overlay -->
    <div id="game-over-overlay" class="hidden">
        <div id="game-over-content"></div>
    </div>

    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
