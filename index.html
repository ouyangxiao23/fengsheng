<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Secret Mission</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div id="app">
    <!-- Status Bar -->
    <div id="status-bar">
      <div class="status-left">Room: <span id="room-id">8888</span></div>
      <div class="status-center" id="game-phase">Wait for players...</div>
      <div class="status-right"><span id="connection-status" class="status-dot">🟢</span></div>
    </div>

    <!-- 1. Table Area: Opponents -->
    <div id="table-area">
      <!-- Avatars will be injected here JS -->
    </div>

    <!-- 2. Stage Area: Card Animations & Events -->
    <div id="stage-area">
      <div class="action-buttons" id="action-buttons" style="display: none;">
        <button class="btn btn-danger">Reject</button>
        <button class="btn btn-primary">Receive</button>
      </div>
    </div>

    <!-- 3. Cockpit: My Stats & Hand -->
    <div id="hand-area">
      <div id="my-intel" class="my-intel-container">
        <!-- My Intel Pips injected JS -->
      </div>
      <div class="hand-container" id="my-hand">
        <!-- Cards will be injected here JS -->
      </div>

      <!-- Hand Actions (Arc Layout) -->
      <div id="hand-actions" class="hand-actions">
        <button class="action-btn">Pass</button>
        <button class="action-btn main-action">Play</button>
        <button class="action-btn">Lock</button>
      </div>

    </div>
  </div>

  <!-- Template for Card (Pure CSS) -->
  <template id="card-template">
    <div class="card">
      <div class="card-inner">
        <div class="card-bg-oval"></div>
        <div class="card-label"></div>
        <div class="card-symbol"></div>
      </div>
    </div>
  </template>

  <script src="/static/script.js"></script>
</body>

</html>
